name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # The boat installs whatever this job produces, unattended. Everything is
      # checked here so that a broken build never becomes a release for the
      # updater to find.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches the webapp version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./webapp/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match webapp version $VERSION" >&2
            exit 1
          fi

      - name: Pack the webapp
        id: pack
        run: |
          mkdir -p dist
          npm pack --workspace lcars-helm --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
          echo "tarball=$(ls *.tgz)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ steps.pack.outputs.tarball }}
            dist/SHA256SUMS
